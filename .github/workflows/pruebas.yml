name: CI Pruebas de Software

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 1. Ejecutar Pruebas Unitarias
      run: |
        pytest -v test_unitarias.py

    - name: 2. Ejecutar Pruebas de Integración (Try / Exception)
      run: |
        pytest -v test_integration.py

    - name: 3. Ejecutar Pruebas de Sistema
      run: |
        pytest -v test_system.py